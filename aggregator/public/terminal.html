<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2016%2016%22%3E%3Crect%20width%3D%2216%22%20height%3D%2216%22%20fill%3D%22%2320190a%22%2F%3E%3Ccircle%20cx%3D%228%22%20cy%3D%228%22%20r%3D%226.2%22%20fill%3D%22none%22%20stroke%3D%22%23d8b866%22%20stroke-width%3D%221.2%22%2F%3E%3Ccircle%20cx%3D%228%22%20cy%3D%228%22%20r%3D%222.4%22%20fill%3D%22none%22%20stroke%3D%22%23d8b866%22%20stroke-width%3D%221.6%22%2F%3E%3Cpath%20d%3D%22M8%201.4v2.2M8%2012.4v2.2M1.4%208h2.2M12.4%208h2.2%22%20stroke%3D%22%23d8b866%22%20stroke-width%3D%221.3%22%2F%3E%3C%2Fsvg%3E">
<title>Lucreocracy</title>
<style>
  :root {
    --frame: #6b5222;
    --title-a: #b08c3c;
    --title-b: #85682a;
    --title-c: #5d4818;
    --face: #ded3b0;
    --face-lo: #c9bd96;
    --face-hi: #f3ecd2;
    --pane: #e7dcba;
    --ink: #2a2318;
    --ink-soft: #5d5134;
    --bevel-hi: #fffbe9;
    --bevel-lo: #8a7c53;
    --bevel-dk: #5f5533;
    --screen: #15140f;
    --screen-hi: #1d1b13;
    --screen-rule: #35301f;
    --glow: #ffc14d;
    --glow-dim: #a8821f;
    --read: #e7dcbd;
    --go: #8fd67a;
    --wait: #6fb6e8;
    --warn: #ffd166;
    --stop: #e8705a;
    --ui: Tahoma, Verdana, "Segoe UI", Geneva, sans-serif;
    --mono: "Lucida Console", ui-monospace, Consolas, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html { height: 100%; background: #15150f; }
  /* Maximized: an XP window that fills the screen keeps no frame and no
     rounded corners, and neither does this. A document floating in the middle
     of a desktop is a PDF viewer, not a launchpad. */
  body {
    margin: 0; height: 100%; overflow: hidden;
    display: flex; flex-direction: column;
    font: 11px/1.45 var(--ui); color: var(--ink); background: var(--frame);
  }
  .title {
    height: 27px; flex: none; display: flex; align-items: center; gap: 7px; padding: 0 10px 0 9px;
    background: linear-gradient(180deg, var(--title-a) 0%, var(--title-b) 48%, var(--title-c) 52%, #4b3912 100%);
    box-shadow: 0 1px 0 rgba(255, 240, 200, 0.45) inset;
  }
  .title h1 { margin: 0; font: bold 12px/1 var(--ui); color: #fff8e4; text-shadow: 1px 1px 1px rgba(0,0,0,.6); }
  .title .fill { flex: 1; }
  .title .meta { font-size: 10px; color: #f0e2bd; text-shadow: 1px 1px 1px rgba(0,0,0,.5); }
  .emblem { width: 16px; height: 16px; flex: none; }

  /* ---- toolbar ------------------------------------------------------- */
  .tools {
    flex: none; display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    padding: 5px 9px; background: var(--face);
    border-top: 1px solid #8f7334; border-bottom: 1px solid var(--bevel-lo);
  }
  .tools .fill { flex: 1; }
  label.f { display: inline-flex; align-items: center; gap: 5px; color: var(--ink-soft); }

  button {
    font: 11px var(--ui); color: var(--ink); padding: 3px 11px;
    border: 1px solid; border-color: var(--bevel-hi) var(--bevel-dk) var(--bevel-dk) var(--bevel-hi);
    border-radius: 3px; background: linear-gradient(180deg, #f6efd6 0%, #e2d7b3 50%, #d3c79f 100%);
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: linear-gradient(180deg, #fff9e4 0%, #eee2bd 50%, #ddd0a6 100%); }
  button:active:not(:disabled), button[aria-pressed="true"] {
    border-color: var(--bevel-dk) var(--bevel-hi) var(--bevel-hi) var(--bevel-dk);
    background: #cfc298;
  }
  button:focus-visible { outline: 1px dotted var(--ink); outline-offset: -4px; }
  select, input {
    font: 11px var(--ui); color: var(--ink); background: #fffdf2; padding: 2px 4px;
    border: 1px solid; border-color: var(--bevel-lo) var(--bevel-hi) var(--bevel-hi) var(--bevel-lo);
    border-radius: 0; max-width: 100%;
  }
  select { max-width: 20ch; }
  input { width: 15ch; }
  select:focus, input:focus { outline: 1px solid #8a6b2f; }

  /* ---- the split: task pane and content ------------------------------ */
  .split { flex: 1; min-height: 0; display: flex; background: var(--face); }
  .pane {
    flex: none; width: 212px; overflow-y: auto; padding: 9px 9px 14px;
    background: linear-gradient(180deg, var(--pane) 0%, #dacf ad 100%);
    background: linear-gradient(180deg, var(--pane) 0%, #d8cdab 100%);
    border-right: 1px solid var(--bevel-lo);
  }
  .pane h2 {
    margin: 0 0 1px; font: bold 11px/1 var(--ui); color: #fff6dc; padding: 5px 8px;
    background: linear-gradient(180deg, #9d7c33, #7a5f22);
    border: 1px solid var(--bevel-dk);
  }
  .pane .group { margin-bottom: 12px; }
  .pane .items { border: 1px solid var(--bevel-lo); border-top: 0; background: #efe6c6; padding: 5px 0; }
  .pane .items a, .pane .items button.link {
    display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: 0;
    padding: 3px 9px; font: 11px var(--ui); color: #43351a; text-decoration: none; cursor: pointer;
  }
  .pane .items a:hover, .pane .items button.link:hover { color: #000; background: #dfd2a8; }
  .pane .items button.link[aria-pressed="true"] { font-weight: bold; background: #d6c79b; }
  .pane .items button.link .ct { float: right; color: #7d6c42; font-weight: normal; }
  .pane dl { margin: 0; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; padding: 6px 9px; }
  .pane dt { color: #6a5a30; }
  .pane dd { margin: 0; font-family: var(--mono); color: #3c2f14; }

  .content { flex: 1; min-width: 0; display: flex; flex-direction: column; padding: 9px; }

  /* ---- tiles: the launchpad grid -------------------------------------- */
  .tiles {
    flex: 1; min-height: 0; overflow-y: auto;
    border: 1px solid; border-color: var(--bevel-lo) var(--bevel-hi) var(--bevel-hi) var(--bevel-lo);
    background: var(--screen);
    padding: 9px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(234px, 1fr)); gap: 8px;
    align-content: start;
  }
  .tile {
    border: 1px solid var(--screen-rule); background: var(--screen-hi);
    padding: 8px 9px 9px; display: flex; flex-direction: column; gap: 6px; min-width: 0;
  }
  .tile:hover { border-color: #6a5a25; background: #241f14; }
  .tile .top { display: flex; gap: 8px; align-items: center; min-width: 0; }
  .av {
    width: 32px; height: 32px; flex: none; display: grid; place-items: center;
    font: bold 12px/1 var(--mono); color: #1a1509; border: 1px solid rgba(0,0,0,.4);
  }
  .tile .names { min-width: 0; flex: 1; }
  .tile .tk { font: bold 13px/1.2 var(--ui); color: #fff1cf; display: block; overflow: hidden; text-overflow: ellipsis; }
  .tile .nm { font-size: 10px; color: #9b8f6f; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile .badge { font-size: 10px; padding: 1px 6px; border: 1px solid; flex: none; }
  .badge.go { color: var(--go); border-color: #3d6a33; background: #1b2a17; }
  .badge.wait { color: var(--wait); border-color: #2d5572; background: #141f28; }
  .badge.stop { color: var(--stop); border-color: #70342a; background: #291613; }
  .tile .nums { display: flex; justify-content: space-between; gap: 8px; font-size: 10px; color: var(--glow-dim); }
  .tile .nums b { display: block; font: 12px/1.3 var(--mono); font-variant-numeric: tabular-nums; color: var(--glow); font-weight: normal; }
  .tile .nums .r { text-align: right; }
  .bar { height: 6px; background: #0b0a07; border: 1px solid #332d1d; position: relative; overflow: hidden; }
  .bar i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(180deg, #ffd470, #c8901c); }
  .bar.full i { background: linear-gradient(180deg, #a9ea96, #5fa94c); }
  .bar.late i { background: linear-gradient(180deg, #f09a86, #c2503a); }
  .tile .foot { display: flex; justify-content: space-between; gap: 8px; font-size: 10px; color: #8d8471; }
  .tile .foot .ad { font-family: var(--mono); }

  /* ---- details: the table -------------------------------------------- */
  .list {
    flex: 1; min-height: 0; overflow: auto;
    border: 1px solid; border-color: var(--bevel-lo) var(--bevel-hi) var(--bevel-hi) var(--bevel-lo);
    background: var(--screen);
  }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    position: sticky; top: 0; text-align: left; font: bold 10px/1 var(--ui); color: var(--ink);
    padding: 5px 12px 5px 7px; white-space: nowrap;
    background: linear-gradient(180deg, #ece0bd 0%, #d6c99f 100%);
    border-right: 1px solid var(--bevel-lo); border-bottom: 1px solid var(--bevel-dk);
  }
  thead th:last-child { border-right: 0; }
  thead th.n { text-align: right; }
  tbody td {
    padding: 4px 12px 4px 7px; color: var(--read); white-space: nowrap;
    border-bottom: 1px solid var(--screen-rule);
  }
  tbody tr:nth-child(even) td { background: #1a1812; }
  tbody tr:hover td { background: #2d2614; color: #fff4d6; }
  td.n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--glow); }
  td.sym { font-weight: bold; color: #fff1cf; }
  td.sym small { font-weight: normal; color: #9b8f6f; margin-left: 6px; }
  td.soft { color: #a79a77; }
  td.addr { font-family: var(--mono); color: #8d8471; }
  .is-go { color: var(--go) !important; }
  .is-wait { color: var(--wait) !important; }
  .is-warn { color: var(--warn) !important; }
  .is-stop { color: var(--stop) !important; }
  .view[hidden] { display: none; }

  /* ---- status bar ---------------------------------------------------- */
  .status { flex: none; display: flex; gap: 3px; padding: 6px 9px 7px; background: var(--face); }
  .status span {
    border: 1px solid; border-color: var(--bevel-lo) var(--bevel-hi) var(--bevel-hi) var(--bevel-lo);
    background: var(--face-lo); padding: 2px 8px; font-size: 10px; white-space: nowrap;
  }
  .status span.wide { flex: 1; }
  .status a { color: #4a3c15; text-decoration: none; }
  .status a:hover { text-decoration: underline; }
  .status .sep { color: #9a8f6a; margin: 0 5px; }
  .led { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #7a7257; margin-right: 5px; vertical-align: -1px; }
  .led.go { background: var(--go); box-shadow: 0 0 5px var(--go); }
  .led.wait { background: var(--warn); box-shadow: 0 0 5px var(--warn); }
  .led.stop { background: var(--stop); box-shadow: 0 0 5px var(--stop); }

  .msg { font-size: 10px; color: #6a5c30; margin: 7px 2px 0; flex: none; }
  .msg.warn { color: #8a5a07; }
  .msg.bad { color: #9b2f1c; }

  .tile.fresh, tr.fresh td { animation: in 1.4s ease-out; }
  @keyframes in { from { background: #4a3a12; } to { background: transparent; } }
  @media (prefers-reduced-motion: reduce) { .tile.fresh, tr.fresh td { animation: none; } }

  @media (max-width: 760px) {
    .pane { display: none; }
    .content { padding: 7px; }
    .tiles { grid-template-columns: repeat(auto-fill, minmax(100%, 1fr)); }
    .status { flex-wrap: wrap; }
    /* The link strip is the one status segment that must be allowed to wrap:
       four links do not fit a phone on one line, and nowrap pushed the page
       sideways. */
    .status span.wide { flex: 1 1 100%; order: 9; white-space: normal; line-height: 1.7; }
  }
</style>
</head>
<body>
<div class="title">
  <svg class="emblem" viewBox="0 0 16 16" aria-hidden="true">
    <circle cx="8" cy="8" r="7" fill="#20190a" stroke="#d8b866" stroke-width="1"/>
    <circle cx="8" cy="8" r="2.6" fill="none" stroke="#d8b866" stroke-width="1.6"/>
    <path d="M8 1.2v2.4M8 12.4v2.4M1.2 8h2.4M12.4 8h2.4" stroke="#d8b866" stroke-width="1.4"/>
  </svg>
  <h1>Lucreocracy</h1>
  <span class="fill"></span>
  <span class="meta" id="title-meta"></span>
</div>

<div class="tools">
  <button id="v-tiles" aria-pressed="true">Tiles</button>
  <button id="v-details" aria-pressed="false">Details</button>
  <span style="width:8px"></span>
  <label class="f">Chain <select id="chain" aria-label="Chain"><option value="">All</option></select></label>
  <label class="f">Launchpad <select id="source" aria-label="Launchpad"><option value="">All</option></select></label>
  <label class="f">Rows <select id="limit" aria-label="Rows">
    <option value="50">50</option><option value="100" selected>100</option>
    <option value="250">250</option><option value="500">500</option>
  </select></label>
  <label class="f">Find <input id="q" placeholder="name or address" autocomplete="off" spellcheck="false" aria-label="Find"></label>
  <span class="fill"></span>
  <button id="reload">Refresh</button>
</div>

<div class="split">
  <div class="pane">
    <div class="group">
      <h2>Show</h2>
      <div class="items" id="filters">
        <button class="link" data-filter="all" aria-pressed="true">All <span class="ct" id="ct-all"></span></button>
        <button class="link" data-filter="filling" aria-pressed="false">Filling <span class="ct" id="ct-filling"></span></button>
        <button class="link" data-filter="trading" aria-pressed="false">Trading <span class="ct" id="ct-trading"></span></button>
        <button class="link" data-filter="expired" aria-pressed="false">Past deadline <span class="ct" id="ct-expired"></span></button>
      </div>
    </div>
    <div class="group">
      <h2>Totals</h2>
      <dl>
        <dt>Coins</dt><dd id="t-coins">—</dd>
        <dt>Trading</dt><dd id="t-trading">—</dd>
        <dt>Launchpads</dt><dd id="t-pads">—</dd>
        <dt>Chains</dt><dd id="t-chains">—</dd>
        <dt>Raised</dt><dd id="t-raised">—</dd>
      </dl>
    </div>
    <div class="group">
      <h2>Chain activity</h2>
      <div class="items">
        <div style="padding:6px 9px">
          <label class="f" style="display:block;margin-bottom:5px">Period</label>
          <select id="window" aria-label="Period" style="width:100%;max-width:100%">
            <option value="1">Last day</option>
            <option value="7" selected>Last 7 days</option>
            <option value="30">Last 30 days</option>
            <option value="90">Last 90 days</option>
            <option value="365">Last year</option>
          </select>
        </div>
        <dl id="activity"></dl>
      </div>
      <p class="msg" id="sat-note" style="margin:6px 2px 0"></p>
    </div>
  </div>

  <div class="content">
    <div class="tiles view" id="tiles"></div>
    <div class="list view" id="details" hidden><table>
      <thead><tr>
        <th>Coin</th><th>Launchpad</th><th>Chain</th><th>Status</th>
        <th class="n">Target</th><th class="n">Raised</th>
        <th class="n">Launched</th><th class="n">To market</th><th>Address</th>
      </tr></thead>
      <tbody id="coins"></tbody>
    </table></div>
    <p class="msg" id="coins-note"></p>
  </div>
</div>

<div class="status">
  <span><i class="led" id="led"></i><span id="feed-text">Connecting</span></span>
  <span id="st-count"></span>
  <span class="wide">
    <a href="/legal/terms-of-service.html">Terms of Service</a><span class="sep">|</span>
    <a href="/legal/terms-of-use.html">Terms of Use</a><span class="sep">|</span>
    <a href="/legal/terms-of-purchase.html">Terms of Purchase</a><span class="sep">|</span>
    <a href="/legal/privacy-policy.html">Privacy Policy</a>
  </span>
  <span>&copy; <span id="year">2026</span> Lucreocracy</span>
  <span id="st-time"></span>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
let sources = [];
let chains = [];
let coins = [];
let filter = "all";
let view = "tiles";

const int = (n) => (n === null || n === undefined ? "—" : Number(n).toLocaleString("en-US"));
const pct = (r) => (r === null || r === undefined ? "—" : Math.round(r * 100) + "%");
const now = () => Math.floor(Date.now() / 1000);

/** Wei to ETH. Divided as a BigInt and then formatted, so a figure never goes
 *  through a float on its way to the screen. */
function eth(wei, digits) {
  if (wei === null || wei === undefined) return null;
  let v;
  try { v = BigInt(wei); } catch (e) { return null; }
  const d = digits === undefined ? 4 : digits;
  const scale = 10n ** 18n;
  const whole = v / scale;
  const frac = (v % scale).toString().padStart(18, "0").slice(0, d).replace(/0+$/, "");
  return frac ? whole.toString() + "." + frac : whole.toString();
}

function dur(secs) {
  if (secs === null || secs === undefined) return "—";
  const s = Math.abs(Number(secs));
  if (s < 90) return Math.round(s) + "s";
  if (s < 5400) return Math.round(s / 60) + "m";
  if (s < 172800) return Math.round(s / 3600) + "h";
  return Math.round(s / 86400) + "d";
}
const ago = (ts) => (ts ? dur(now() - Number(ts)) : "—");
const short = (a) => (a && a.length > 12 ? a.slice(0, 6) + "…" + a.slice(-4) : a || "");
const chainLabel = (id) => (chains.find((c) => c.chainId === id) || {}).label || String(id);
const sourceLabel = (id) => (sources.find((s) => s.id === id) || {}).label || id;

/** Filling, Trading, or past its deadline without getting there. */
function phase(c) {
  if (c.graduated) return "trading";
  if (c.deadline && Number(c.deadline) < now()) return "expired";
  return "filling";
}

/** A tile needs a mark, and the launchpads do not give us one. Derived from
 *  the address so it is stable, and plainly generated rather than pretending
 *  to be a logo somebody chose. */
function avatar(c) {
  const a = (c.address || "").toLowerCase();
  let h = 0;
  for (let i = 2; i < a.length; i++) h = (h * 31 + a.charCodeAt(i)) % 360;
  const el = document.createElement("div");
  el.className = "av";
  el.style.background = "linear-gradient(135deg, hsl(" + h + " 52% 62%), hsl(" + ((h + 38) % 360) + " 46% 42%))";
  el.textContent = (c.symbol || "?").slice(0, 2).toUpperCase();
  return el;
}

async function get(path) {
  const r = await fetch(path);
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
function msg(el, text, kind) {
  el.textContent = text || "";
  el.className = "msg" + (kind ? " " + kind : "");
}
function cell(text, cls) {
  const td = document.createElement("td");
  if (cls) td.className = cls;
  td.textContent = text === null || text === undefined ? "—" : text;
  return td;
}
function clock() {
  $("st-time").textContent = new Date().toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
}

// ---- tiles --------------------------------------------------------------

function tile(c) {
  const p = phase(c);
  const el = document.createElement("div");
  el.className = "tile";
  el.dataset.address = (c.address || "").toLowerCase();

  const top = document.createElement("div");
  top.className = "top";
  const names = document.createElement("div");
  names.className = "names";
  const tk = document.createElement("span");
  tk.className = "tk";
  tk.textContent = c.symbol || "—";
  const nm = document.createElement("span");
  nm.className = "nm";
  nm.textContent = c.name && c.name !== c.symbol ? c.name : sourceLabel(c.source);
  names.append(tk, nm);
  const badge = document.createElement("span");
  badge.className = "badge " + (p === "trading" ? "go" : p === "expired" ? "stop" : "wait");
  badge.textContent = p === "trading" ? "Trading" : p === "expired" ? "Past deadline" : "Filling";
  top.append(avatar(c), names, badge);

  const nums = document.createElement("div");
  nums.className = "nums";
  const left = document.createElement("div");
  const right = document.createElement("div");
  right.className = "r";
  const target = eth(c.targetRaiseWei);
  const raised = eth(c.raisedWei);
  left.innerHTML = "";
  const lb = document.createElement("b");
  const lk = document.createElement("span");
  const rb = document.createElement("b");
  const rk = document.createElement("span");
  if (p === "trading") {
    lb.textContent = raised === null ? "—" : raised + " ETH";
    lk.textContent = "Raised";
    rb.textContent = c.graduatedAt && c.launchedAt ? dur(c.graduatedAt - c.launchedAt) : "—";
    rk.textContent = "To market";
  } else {
    lb.textContent = target === null ? "—" : target + " ETH";
    lk.textContent = "Target";
    rb.textContent = c.deadline ? dur(Number(c.deadline) - now()) : "—";
    rk.textContent = p === "expired" ? "Overdue" : "Left";
  }
  left.append(lb, lk);
  right.append(rb, rk);
  nums.append(left, right);

  el.append(top, nums);

  // A bar, and only where there is something real to put in it. For a coin
  // that reached a market it is what it took against what it needed; for one
  // still filling it is the clock, which is the only progress the launch
  // events actually publish. Current raise would need the indexer to read
  // curve state, so no bar pretends to show it.
  if (p === "trading" && c.raisedWei && c.targetRaiseWei) {
    let share = 0;
    try {
      const t = BigInt(c.targetRaiseWei);
      if (t > 0n) share = Number((BigInt(c.raisedWei) * 1000n) / t) / 1000;
    } catch (e) { /* leave it at zero */ }
    el.append(bar(Math.min(1, share), "full"), legend(pct(share) + " of target"));
  } else if (c.deadline && c.launchedAt) {
    const span = Number(c.deadline) - Number(c.launchedAt);
    const gone = now() - Number(c.launchedAt);
    const share = span > 0 ? Math.max(0, Math.min(1, gone / span)) : 1;
    el.append(bar(share, p === "expired" ? "late" : ""), legend(p === "expired" ? "deadline passed" : "of its window gone"));
  }

  const foot = document.createElement("div");
  foot.className = "foot";
  const when = document.createElement("span");
  when.textContent = ago(c.launchedAt) + " ago";
  const ad = document.createElement("span");
  ad.className = "ad";
  ad.textContent = short(c.address);
  ad.title = c.address || "";
  foot.append(when, ad);
  el.append(foot);
  return el;
}

function bar(share, cls) {
  const b = document.createElement("div");
  b.className = "bar" + (cls ? " " + cls : "");
  const i = document.createElement("i");
  i.style.width = Math.round(share * 100) + "%";
  b.append(i);
  return b;
}
function legend(text) {
  const p = document.createElement("div");
  p.className = "foot";
  p.style.marginTop = "-2px";
  const s = document.createElement("span");
  s.textContent = text;
  p.append(s);
  return p;
}

// ---- details ------------------------------------------------------------

function coinRow(c) {
  const p = phase(c);
  const tr = document.createElement("tr");
  tr.dataset.address = (c.address || "").toLowerCase();
  const sym = document.createElement("td");
  sym.className = "sym";
  sym.textContent = c.symbol || "—";
  if (c.name && c.name !== c.symbol) {
    const n = document.createElement("small");
    n.textContent = c.name;
    sym.append(n);
  }
  const addr = cell(short(c.address), "addr");
  addr.title = c.address || "";
  tr.append(
    sym,
    cell(sourceLabel(c.source), "soft"),
    cell(chainLabel(c.chainId), "soft"),
    cell(p === "trading" ? "Trading" : p === "expired" ? "Past deadline" : "Filling",
      p === "trading" ? "is-go" : p === "expired" ? "is-stop" : "is-wait"),
    cell(eth(c.targetRaiseWei), "n"),
    cell(eth(c.raisedWei), "n"),
    cell(ago(c.launchedAt), "n"),
    cell(c.graduated && c.graduatedAt && c.launchedAt ? dur(c.graduatedAt - c.launchedAt) : "—", "n"),
    addr,
  );
  return tr;
}

// ---- render -------------------------------------------------------------

function shown() {
  const q = $("q").value.trim().toLowerCase();
  return coins.filter((c) => {
    if (filter !== "all" && phase(c) !== filter) return false;
    if (!q) return true;
    return (
      (c.name || "").toLowerCase().includes(q) ||
      (c.symbol || "").toLowerCase().includes(q) ||
      (c.address || "").toLowerCase().includes(q)
    );
  });
}

function totals() {
  const by = { all: coins.length, filling: 0, trading: 0, expired: 0 };
  let raised = 0n;
  for (const c of coins) {
    by[phase(c)]++;
    if (c.raisedWei) { try { raised += BigInt(c.raisedWei); } catch (e) { /* skip */ } }
  }
  for (const k of ["all", "filling", "trading", "expired"]) $("ct-" + k).textContent = by[k] ? String(by[k]) : "";
  $("t-coins").textContent = int(coins.length);
  $("t-trading").textContent = int(by.trading);
  $("t-raised").textContent = raised > 0n ? eth(raised.toString(), 3) + " ETH" : "—";
  $("st-count").textContent = coins.length + " coins";
}

function render() {
  const rows = shown();
  const tiles = $("tiles");
  const body = $("coins");
  tiles.textContent = "";
  body.textContent = "";
  if (view === "tiles") for (const c of rows) tiles.append(tile(c));
  else for (const c of rows) body.append(coinRow(c));
  totals();
  msg($("coins-note"), rows.length !== coins.length ? rows.length + " of " + coins.length + " shown" : "");
}

async function loadCoins() {
  try {
    const params = new URLSearchParams({ limit: $("limit").value });
    if ($("chain").value) params.set("chainId", $("chain").value);
    if ($("source").value) params.set("source", $("source").value);
    coins = (await get("/api/coins?" + params.toString())).coins;
    render();
    clock();
  } catch (e) {
    msg($("coins-note"), e.message, "bad");
  }
}

// ---- chain activity -----------------------------------------------------

async function loadSaturation() {
  const host = $("activity");
  try {
    const s = await get("/api/saturation?windowDays=" + encodeURIComponent($("window").value));
    host.textContent = "";
    if (!s.chains.length) {
      msg($("sat-note"), "Nothing launched in this period.");
      return;
    }
    let fast = 0;
    for (const c of s.chains) {
      fast += c.fastGraduations;
      for (const [k, v] of [
        [chainLabel(c.chainId), ""],
        ["  launched", int(c.launches)],
        ["  reached market", pct(c.graduationRate)],
        ["  median time", dur(c.medianTurnoverSecs)],
      ]) {
        const dt = document.createElement("dt");
        dt.textContent = k;
        const dd = document.createElement("dd");
        dd.textContent = v;
        host.append(dt, dd);
      }
    }
    msg($("sat-note"), fast ? fast + " reached a market in under ten minutes." : "", fast ? "warn" : "");
  } catch (e) {
    host.textContent = "";
    msg($("sat-note"), e.message, "bad");
  }
}

// ---- live ---------------------------------------------------------------

function feed(state, text) {
  $("led").className = "led " + state;
  $("feed-text").textContent = text;
}

function connect() {
  let ws;
  try {
    ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  } catch (e) {
    feed("stop", "Offline");
    return;
  }
  feed("wait", "Connecting");
  ws.onopen = () => {
    for (const channel of ["coin:launched", "coin:graduated"]) {
      ws.send(JSON.stringify({ op: "subscribe", channel: channel, token: "*" }));
    }
    feed("go", "Live");
  };
  ws.onmessage = (ev) => {
    let m;
    try { m = JSON.parse(ev.data); } catch (e) { return; }
    if (m.channel === "coin:launched") onLaunched(m.data);
    else if (m.channel === "coin:graduated") onGraduated(m.data);
  };
  ws.onclose = () => {
    feed("wait", "Reconnecting");
    setTimeout(connect, 4000);
  };
  ws.onerror = () => ws.close();
}

function onLaunched(c) {
  if (!c || !c.address) return;
  const addr = String(c.address).toLowerCase();
  if (coins.some((x) => (x.address || "").toLowerCase() === addr)) return;
  if ($("chain").value && String(c.chainId) !== $("chain").value) return;
  if ($("source").value && c.source !== $("source").value) return;
  coins.unshift(c);
  render();
  const fresh = document.querySelector('[data-address="' + addr + '"]');
  if (fresh) fresh.classList.add("fresh");
  clock();
}

function onGraduated(c) {
  if (!c || !c.address) return;
  const addr = String(c.address).toLowerCase();
  const held = coins.find((x) => (x.address || "").toLowerCase() === addr);
  if (!held) return;
  held.graduated = true;
  if (c.graduatedAt) held.graduatedAt = c.graduatedAt;
  if (c.raisedWei) held.raisedWei = c.raisedWei;
  if (c.pairSeededWei) held.pairSeededWei = c.pairSeededWei;
  render();
  const fresh = document.querySelector('[data-address="' + addr + '"]');
  if (fresh) fresh.classList.add("fresh");
  clock();
  loadSaturation();
}

// ---- start --------------------------------------------------------------

function setView(next) {
  view = next;
  $("v-tiles").setAttribute("aria-pressed", String(next === "tiles"));
  $("v-details").setAttribute("aria-pressed", String(next === "details"));
  $("tiles").hidden = next !== "tiles";
  $("details").hidden = next !== "details";
  render();
}

for (const b of document.querySelectorAll("#filters button")) {
  b.onclick = () => {
    filter = b.dataset.filter;
    for (const other of document.querySelectorAll("#filters button")) {
      other.setAttribute("aria-pressed", String(other === b));
    }
    render();
  };
}

async function start() {
  $("year").textContent = String(new Date().getFullYear());
  clock();
  try {
    const s = await get("/api/sources");
    chains = s.chains;
    sources = s.sources;
    $("t-chains").textContent = int(chains.length);
    $("t-pads").textContent = int(sources.length);
    $("title-meta").textContent =
      sources.length + (sources.length === 1 ? " launchpad" : " launchpads") +
      " on " + chains.length + (chains.length === 1 ? " chain" : " chains");
    for (const c of chains) {
      const o = document.createElement("option");
      o.value = String(c.chainId);
      o.textContent = c.label;
      $("chain").append(o);
    }
    for (const src of sources) {
      const o = document.createElement("option");
      o.value = src.id;
      o.textContent = chains.length > 1 ? src.label + " · " + chainLabel(src.chainId) : src.label;
      o.title = src.label + " · " + chainLabel(src.chainId);
      $("source").append(o);
    }
  } catch (e) {
    msg($("coins-note"), e.message, "bad");
    feed("stop", "Offline");
    return;
  }
  await Promise.all([loadCoins(), loadSaturation()]);
  connect();
  setInterval(() => {
    if (document.hidden) return;
    loadCoins();
    loadSaturation();
  }, 60000);
  // The tiles count down, so they are redrawn on their own clock.
  setInterval(() => { if (!document.hidden && view === "tiles") render(); }, 20000);
  setInterval(clock, 30000);
}

$("v-tiles").onclick = () => setView("tiles");
$("v-details").onclick = () => setView("details");
$("reload").onclick = () => { loadCoins(); loadSaturation(); };
$("window").onchange = loadSaturation;
$("chain").onchange = loadCoins;
$("source").onchange = loadCoins;
$("limit").onchange = loadCoins;
$("q").oninput = render;

start();
</script>
</body>
</html>
